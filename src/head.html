<!-- head.html: el principio de la página. El plugin de Vite (herramientas/vite/curiolandia.mts) lo pone delante del
     <script> con el juego (src/modulos.ts y todo lo que importa). Contiene: título, fuentes, estilos (CSS), los dos lienzos del juego,
     Three.js y los paneles HTML (nombre, empezar de nuevo y zona de adultos). El plugin cambia las fuentes de Google y
     Three.js por las copias locales de public/ para que la web funcione sin internet. -->
<title>Curiolandia 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<!-- Estilos: html/body sin márgenes ni desplazamiento (el juego ocupa toda la pantalla); #gl y #cv, los lienzos;
     #adult, el panel de la zona de adultos (aplicacion/adultos/: .row filas, .opt opciones, .note notas, .tm temas, .cal asambleas,
     .pill etiquetas de la tabla de habilidades; desde la fase A1 de docs/PLAN-MENU-ADULTOS.md, la cabecera fija, el menú de
     categorías nav.menu y las páginas .pag: menú lateral en tableta y ordenador, menú de iconos con poca altura (móvil en
     horizontal) y portada de tarjetas (.portada) en el móvil en vertical, con la misma consulta que MODO_PAGINAS de
     aplicacion/adultos/panel.ts); #nameDlg y #resetDlg, los diálogos del nombre y de empezar de nuevo. -->
<style>
:root{--paper:#FFF6E6;--ink:#4A3428;--lav:#9B8AD9;color-scheme:light}
html,body{margin:0;height:100%;background:#2E2420;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#gl{position:fixed;inset:0;display:block;width:100%;height:100%;background:#BFE9F8}#cv{position:fixed;inset:0;display:block;touch-action:none}
#adult{position:fixed;inset:0;background:rgba(46,36,32,.6);display:flex;justify-content:center;align-items:center;overflow:hidden;padding:16px;box-sizing:border-box;touch-action:auto;-webkit-user-select:text;user-select:text;font-family:Fredoka,system-ui,sans-serif;color:var(--ink)}
#adult[hidden]{display:none}
#adult .panel{background:var(--paper);border:3px solid var(--ink);border-radius:28px;max-width:1040px;width:100%;height:100%;max-height:860px;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box}
#adult header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none;padding:12px 20px;border-bottom:2px dashed #E4D3B8}
#adult header h2{flex:1}#adult #a-atras{display:none}
#adult .cuerpo{flex:1;min-height:0;display:flex}
#adult nav.menu{flex:none;width:230px;overflow:auto;padding:12px;box-sizing:border-box;border-right:2px dashed #E4D3B8;display:flex;flex-direction:column;gap:6px}
#adult nav.menu button{display:flex;align-items:center;gap:10px;text-align:left;border-radius:16px;min-height:48px;border-color:#E4D3B8;padding:6px 12px}
#adult nav.menu button[aria-current=page]{background:#FFF0C2;border-color:var(--ink)}
#adult nav.menu .ico{font-size:24px;line-height:1}#adult nav.menu .corto{display:none}
#adult .body{flex:1;min-width:0;overflow:auto;padding:0 22px 26px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#adult .pag-t{font-size:24px;margin:14px 0 2px;color:var(--ink)}#adult .pag-t:focus{outline:none}#adult .pag-t:focus-visible{outline:3px solid var(--lav)}
#adult .pag>section:first-of-type{border-top:0}
@media (max-height:500px){
 #adult{padding:0}#adult .panel{max-width:none;max-height:none;border:0;border-radius:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
 #adult header{padding:6px 12px}#adult header h2{font-size:22px}
 #adult nav.menu{width:96px;padding:6px;gap:4px}
 #adult nav.menu button{flex-direction:column;justify-content:center;gap:2px;text-align:center;padding:4px;min-height:52px}
 #adult nav.menu .nom{display:none}#adult nav.menu .corto{display:block;font-size:12px}
}
@media (max-width:719px) and (min-height:501px){
 #adult{padding:0}#adult .panel{max-width:none;max-height:none;border:0;border-radius:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
 #adult header{padding:8px 12px}#adult header h2{font-size:22px}
 #adult .panel:not(.portada) #a-atras{display:inline-block}#adult .panel:not(.portada) header h2{display:none}
 #adult nav.menu{width:auto;flex:1;border:0;display:grid;grid-template-columns:repeat(2,1fr);align-content:start;gap:10px;padding:14px}
 #adult nav.menu button{flex-direction:column;justify-content:center;text-align:center;min-height:104px;font-size:17px;gap:6px}
 #adult nav.menu .ico{font-size:36px}
 #adult .panel:not(.portada) nav.menu{display:none}#adult .panel.portada .body{display:none}
 #adult .body{padding:0 14px 22px}
}
#adult h2{margin:0;font-size:28px}#adult h3{margin:0 0 8px;font-size:20px;color:#7E6CC4}
#adult section{border-top:2px dashed #E4D3B8;padding:14px 0 6px}
#adult label{display:block;margin:6px 0}#adult input[type=text],#adult input:not([type]){font:inherit;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;width:100%;max-width:320px;box-sizing:border-box;margin-top:4px;background:#fff}
#adult .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:6px 0}#adult .row>span{min-width:64px;font-weight:600}
#adult .opt{display:inline-flex;gap:6px;align-items:center;margin:0;background:#fff;border:2px solid #E4D3B8;border-radius:999px;padding:4px 12px}
#adult .rng{display:flex;align-items:center;gap:12px}#adult .rng input{flex:1;max-width:280px}
#adult .note{font-size:14px;color:#7A6252;margin:6px 0}
#adult .tip{background:#FFF0C2;border-radius:14px;padding:10px 14px;font-size:15px}
#adult table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}#adult th,#adult td{text-align:left;padding:6px 8px;border-bottom:1px solid #E4D3B8}
#adult td.lt{font-family:Andika,sans-serif;font-weight:700;font-size:22px}
#adult .pill{border-radius:999px;padding:2px 10px;font-size:13px;background:#EEE}#adult .pAprendida{background:#D6F2CF}#adult .pLecuesta{background:#FFD7D0}#adult .pEncamino{background:#FFF0C2}
#adult button{font:inherit;font-weight:600;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer}
#adult button:focus-visible,#adult input:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
#adult .danger{background:#FFD7D0}#adult #a-close{background:var(--lav);color:#fff}#adult #a-titulo:focus{outline:none}
#adult .days{display:flex;gap:8px;flex-wrap:wrap}#adult .day{background:#fff;border-radius:12px;padding:6px 10px;text-align:center;font-size:14px}
#adult ul{padding-left:20px;margin:8px 0}
#adult h4{margin:10px 0 4px}#adult details summary{cursor:pointer;font-weight:600;margin:8px 0}
#adult .recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
#adult .rec{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #E4D3B8;border-radius:14px;padding:4px 8px}
#adult .rec b{font-family:Andika,sans-serif;font-size:20px;min-width:34px}#adult .rec small{flex:1;color:#7A6252;font-size:13px}
#adult .rec.has{border-color:#7CC86E;background:#F1FAEE}#adult .rec.on{border-color:#FF5A5A;background:#FFE9E6}
#adult .rec button{padding:4px 10px;font-size:14px}#adult .rec button:disabled{opacity:.35}
#adult .rec .up{margin:0;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;cursor:pointer;background:#fff;font-weight:600}#adult .rec .up input{display:none}
#nameDlg,#resetDlg{position:fixed;inset:0;background:rgba(46,36,32,.6);display:flex;justify-content:center;align-items:center;padding:16px;font-family:Fredoka,system-ui,sans-serif;color:#4A3428;touch-action:auto}
#nameDlg[hidden],#resetDlg[hidden]{display:none}#nameDlg .panel,#resetDlg .panel{background:#FFF6E6;border:3px solid #4A3428;border-radius:28px;padding:22px;max-width:440px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
#nameDlg h2,#resetDlg h2{margin:0;font-size:24px}#nameDlg input{font:inherit;font-size:26px;padding:10px 14px;border:2px solid #4A3428;border-radius:14px;-webkit-user-select:text;user-select:text}
#nameDlg .row,#resetDlg .row{display:flex;gap:10px}#nameDlg button,#resetDlg button{font:inherit;font-weight:600;font-size:18px;border:2px solid #4A3428;border-radius:999px;padding:8px 18px;background:#fff;cursor:pointer}#nameDlg #nm-ok{background:#7CC86E;color:#fff}
#adult .temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
#adult .tm{background:#fff;border:2px solid #E4D3B8;border-radius:14px;padding:6px 10px;font-size:15px}#adult .tm.done{border-color:#7CC86E;background:#F1FAEE}
#adult .tm b{display:block}#adult .bar{height:8px;border-radius:4px;background:#EADFCF;margin-top:4px;overflow:hidden}#adult .bar i{display:block;height:100%;background:#FFC93C}
#adult .cal{display:flex;gap:6px;flex-wrap:wrap}#adult .cal span{background:#fff;border-radius:12px;padding:4px 8px;text-align:center;font-size:13px;min-width:54px}#adult .cal b{font-size:20px;display:block}
#adult select{font:inherit;padding:6px 10px;border:2px solid var(--ink);border-radius:12px;background:#fff}
</style>
<!-- Dos lienzos uno encima del otro: #gl (debajo) es donde Three.js dibuja el mundo 3D (src/mundo3d/);
     #cv (encima) es el lienzo 2D de core.js, donde se dibujan las escenas 2D y la interfaz sobre el 3D. -->
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<!-- Diálogo para escribir el nombre de quien juega (openNameDlg en aplicacion/adultos.ts). -->
<div id="nameDlg" hidden><div class="panel"><h2>¿Cómo se llama quien juega?</h2><p style="margin:0;font-size:15px;color:#7A6252">Tito lo va a decir en voz alta. Se puede dejar vacío.</p><input id="nm-in" maxlength="20" autocomplete="off" placeholder="Nombre"><div class="row"><button id="nm-ok" type="button">Listo</button><button id="nm-x" type="button">Cancelar</button></div></div></div>
<!-- Diálogo para empezar de nuevo (openResetDlg y doReset en aplicacion/adultos.ts). -->
<div id="resetDlg" class="dlg" hidden><div class="panel"><h2>¿Empezar de nuevo?</h2><p style="margin:0">Se borra todo el progreso: temas, estrellas, figuritas, asambleas, el nombre y la edad. Se conservan el idioma, el volumen y el límite de tiempo.</p><div class="row"><button id="rs-yes" type="button" style="background:#E2574C;color:#fff">Sí, borrar todo</button><button id="rs-no" type="button">No</button></div></div></div>
<!-- Zona de adultos: openAdult() (aplicacion/adultos/panel.ts) rellena el menú (nav.menu) y .body con una página por
     categoría cada vez que se abre (fase A1 de docs/PLAN-MENU-ADULTOS.md). -->
<div id="adult" hidden role="dialog" aria-modal="true" aria-labelledby="a-titulo"><div class="panel"><header><button id="a-atras" type="button">‹ Categorías</button><h2 id="a-titulo" tabindex="-1">Zona de adultos</h2><button id="a-close" type="button">Volver al juego</button></header><div class="cuerpo"><nav class="menu" aria-label="Categorías"></nav><div class="body"></div></div></div></div>
