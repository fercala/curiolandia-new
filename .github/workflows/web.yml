# Monta la web y pasa las pruebas en cada PR y en cada push a main; desde main, además, la publica en GitHub Pages.
# Pruebas (ver tests/regresion/LEEME.md): comentarios de cabecera, humo (escenas de día y de noche), los fallos B1-B7,
# la elección de voz, la casa de Tito, la copia de la partida de curiolandia-3d y una octava parte de los juegos.
# Las pruebas de regresión siempre terminan con 0; comprobar.js lee sus resultados y falla si hay hallazgos.
name: Web

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:comentarios
      - run: npm run test:humo
      - run: npm run test:pr
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            tests/regresion/salida/
            tests/capturas/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
