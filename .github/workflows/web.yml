# Monta la web y pasa las pruebas rápidas en cada PR y en cada push a main; desde main, además, la publica en GitHub Pages.
# Pruebas rápidas (unos 3 minutos): comentarios de cabecera, formato (Prettier) y linter (oxlint)
# (docs/FORMATO-Y-LINTER.md), tipos (TypeScript estricto y el límite de avisos de src/*.js, docs/TIPOS.md) y Vitest
# (tests/unidad). Las de Playwright (humo y `npm run test:pr`, tests/regresion/LEEME.md) tardan mucho con el 3D sin
# tarjeta gráfica y gastaban los minutos gratis de GitHub: desde la v0.2.181 se pasan solo en local, con
# `npm run test:local`, antes de pedir la fusión (Fernando, 25 de noviembre de 2026).
name: Web

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm run test:comentarios
      - run: npm run formato:comprobar
      - run: npm run lint
      - run: npm run tipos
      - run: npm run test:unidad
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
